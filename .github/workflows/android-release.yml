name: Android test release
on:
  push:
    branches: [main, feature/android-cbt-voice-ai, feature/modern-ui-integrated-qwen3, feature/rating-buttons-0-10, feature/splash-brain-launcher-icon, fix/cloud-audio-stt-0-2-5, fix/stt-api-429-diagnostics, feature/groq-free-online-ai, fix/tts-score-streak-summary-0-2-8, fix/summary-score-groq-ai-0-2-9]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble TEST release
        run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Diario-CBT-v0.2.9-Compact
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
