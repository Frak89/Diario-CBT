plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.frak89.diariocbt'
    compileSdk 36
    defaultConfig {
        applicationId 'com.frak89.diariocbt'
        minSdk 28
        targetSdk 36
        versionCode 13
        versionName '0.3.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    androidResources { noCompress += ['litertlm'] }
    def storePath=System.getenv('CBT_KEYSTORE_PATH')
    def alias=System.getenv('CBT_KEY_ALIAS')
    def storePass=System.getenv('CBT_STORE_PASSWORD')
    def keyPass=System.getenv('CBT_KEY_PASSWORD')
    signingConfigs {
        if(storePath && alias && storePass && keyPass) {
            stable {
                storeFile file(storePath)
                storePassword storePass
                keyAlias alias
                keyPassword keyPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if(storePath && alias && storePass && keyPass) {
                signingConfig signingConfigs.stable
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
}
dependencies {
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.18.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    testImplementation 'junit:junit:4.13.2'
}
